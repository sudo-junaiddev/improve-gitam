<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitting Placement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="style.css"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      :root {
        --bg: #0b1220;
        --bg-card: #111a2e;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: #1e293b;
        --yellow: #facc15;
        --green-light: #4ade80;
        --blue-light: #60a5fa;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 15px;
        --text-xl: 22px;
      }

      .sp-page {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .sp-hero {
        padding: 40px 0 20px;
        text-align: center;
      }

      .sp-hero h1 {
        color: #fff;
        font-size: clamp(32px, 5vw, 48px);
        font-weight: 700;
        letter-spacing: -1.5px;
        margin: 0;
      }

      .sp-card {
        border: 1px solid var(--border);
        background: var(--bg-card);
        border-radius: 16px;
        padding: 24px;
      }

      .sp-section-label {
        color: var(--green-light);
        font-size: var(--text-xs);
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .sp-section h2 {
        color: var(--text);
        font-size: var(--text-xl);
        font-weight: 600;
        margin: 4px 0 16px;
      }

      .building-shape {
        stroke: var(--border);
        stroke-width: 2;
        fill: var(--bg-card);
        transition:
          fill 0.2s,
          stroke 0.2s;
      }

      .building-shape.selected {
        fill: rgba(96, 165, 250, 0.15);
        stroke: var(--blue-light);
      }

      .seat {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--muted);
        font-size: var(--text-xs);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .seat.highlight {
        background: var(--yellow);
        color: #1a1a1a;
        border-color: var(--yellow);
        font-weight: 700;
      }

      .seat-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 8px;
      }

      .seat-row-label {
        width: 20px;
        color: var(--muted);
        font-weight: 600;
        font-size: var(--text-sm);
      }

      .seat-pair {
        display: flex;
        gap: 6px;
      }

      .seat-pair.aisle-gap {
        margin-left: 90px;
      }

      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: #fff;
          color: #000;
        }
        .sp-card {
          border: 1px solid #ccc;
          background: #fff;
        }
        .seat {
          border-color: #999;
          color: #333;
        }
        .seat.highlight {
          background: #facc15;
          color: #000;
        }
      }
    </style>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)]">
    <div class="sp-page">
      <div class="sp-hero">
        <h1>Sitting Placement</h1>
      </div>

      <!-- ADMISSION NUMBER -->
      <div class="sp-card no-print mb-6 mx-auto w-full max-w-md text-center">
        <label for="admNo" class="sp-section-label block mb-2"
          >Admission Number</label
        >
        <div class="join w-full">
          <input
            id="admNo"
            type="text"
            placeholder="Enter Admission Number"
            class="input input-bordered join-item w-full bg-[var(--bg)] border-[var(--border)] text-[var(--text)]"
          />
          <button
            id="checkBtn"
            class="btn join-item bg-[var(--yellow)] text-black border-none"
          >
            CHECK
          </button>
        </div>
      </div>

      <!-- SEAT NO. & SEAT MAP SECTION -->
      <div class="sp-section">
        <p class="sp-section-label">Exam Hall</p>
        <h2>Seat Map</h2>

        <div class="sp-card">
          <div class="flex flex-col md:flex-row gap-6 no-print mb-6">
            <div class="flex-1">
              <label class="sp-section-label block mb-2">Building</label>
              <select
                id="buildingSelect"
                class="select select-bordered w-full bg-[var(--bg)] border-[var(--border)] text-[var(--text)]"
              >
                <option value="SB">SB</option>
                <option value="VB">VB</option>
              </select>

              <svg
                id="buildingSvg"
                viewBox="0 0 200 120"
                class="mt-4 w-full max-w-[220px]"
              >
                <rect
                  id="shapeSB"
                  class="building-shape selected"
                  x="20"
                  y="20"
                  width="160"
                  height="80"
                  rx="6"
                ></rect>
                <polygon
                  id="shapeVB"
                  class="building-shape"
                  points="60,10 140,10 180,60 140,110 60,110 20,60"
                  style="display: none"
                ></polygon>
              </svg>
            </div>

            <div class="flex-1">
              <label for="seatInput" class="sp-section-label block mb-2"
                >Seat No.</label
              >
              <div class="join w-full">
                <input
                  id="seatInput"
                  type="text"
                  placeholder="e.g. A1-2"
                  class="input input-bordered join-item w-full bg-[var(--bg)] border-[var(--border)] text-[var(--text)]"
                />
                <button
                  id="findSeatBtn"
                  class="btn join-item bg-[var(--blue-light)] text-black border-none hover:brightness-90"
                >
                  FIND
                </button>
              </div>
              <p class="text-[var(--muted)] text-[var(--text-xs)] mt-2">
                Format: Row + block number, e.g. "A1-2" = Row A, Seat 2
              </p>
            </div>
          </div>

          <!-- SUMMARY DISPLAY FOR PRINTING -->
          <div
            id="printSummary"
            class="hidden print:block mb-4 p-4 border border-gray-300 rounded"
          >
            <p>
              <strong>Admission Number:</strong>
              <span id="summaryAdmNo">N/A</span>
            </p>
            <p>
              <strong>Seat No.:</strong> <span id="summarySeatNo">N/A</span>
            </p>
          </div>

          <!-- SEAT MAP -->
          <div id="seatChart" class="flex flex-col items-start"></div>

          <div class="mt-6 no-print">
            <button
              id="printBtn"
              class="btn bg-[var(--green-light)] text-black border-none hover:brightness-90"
            >
              PRINT
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer class="site-footer">
      Made by

      <a href="https://abujuni.dev" target="_blank" rel="noopener noreferrer">
        <b>Junaid</b>
      </a>
    </footer>
    <script>
      const SITTING_LOOKUP_URL =
        "https://gstudent.gitam.edu/Hallticket/Roomdetails";

      document.getElementById("checkBtn").addEventListener("click", () => {
        const admNo = document.getElementById("admNo").value.trim();
        if (!admNo) return;
        document.getElementById("summaryAdmNo").textContent = admNo;
        const url = `${SITTING_LOOKUP_URL}?regdno=${encodeURIComponent(admNo)}`;
        window.open(url, "_blank");
      });

      const buildingSelect = document.getElementById("buildingSelect");
      const shapeSB = document.getElementById("shapeSB");
      const shapeVB = document.getElementById("shapeVB");

      buildingSelect.addEventListener("change", (e) => {
        const isSB = e.target.value === "SB";
        shapeSB.style.display = isSB ? "block" : "none";
        shapeVB.style.display = isSB ? "none" : "block";
        shapeSB.classList.toggle("selected", isSB);
        shapeVB.classList.toggle("selected", !isSB);
      });

      const rows = ["A", "B", "C", "D", "E", "F", "G"];

      function pairsForRow(row) {
        return row === "A"
          ? [
              [1, 2],
              [3, 4],
            ]
          : [
              [1, 2],
              [3, 4],
              [5, 6],
            ];
      }

      function renderChart(highlightRow = null, highlightSeat = null) {
        const container = document.getElementById("seatChart");
        container.innerHTML = "";

        rows.forEach((row) => {
          const rowEl = document.createElement("div");
          rowEl.className = "seat-row";

          const label = document.createElement("div");
          label.className = "seat-row-label";
          label.textContent = row;
          rowEl.appendChild(label);

          const pairs = pairsForRow(row);
          pairs.forEach((pair, i) => {
            const pairEl = document.createElement("div");
            pairEl.className = "seat-pair";
            if (row === "A" && i === 1) {
              pairEl.classList.add("aisle-gap");
            }
            pair.forEach((seatNum) => {
              const seatEl = document.createElement("div");
              seatEl.className = "seat";
              if (row === highlightRow && seatNum === highlightSeat) {
                seatEl.classList.add("highlight");
              }
              seatEl.textContent = seatNum;
              pairEl.appendChild(seatEl);
            });
            rowEl.appendChild(pairEl);
          });

          container.appendChild(rowEl);
        });
      }

      renderChart();

      document.getElementById("findSeatBtn").addEventListener("click", () => {
        const raw = document
          .getElementById("seatInput")
          .value.trim()
          .toUpperCase();
        const match = raw.match(/^([A-G])\d*-(\d+)$/);
        if (!match) {
          alert('Please use the format "A1-2" (Row A, seat 2).');
          return;
        }
        const row = match[1];
        const seatNum = parseInt(match[2], 10);

        const validSeats = pairsForRow(row).flat();
        if (!validSeats.includes(seatNum)) {
          alert(`Seat ${seatNum} does not exist in row ${row}.`);
          return;
        }
        document.getElementById("summarySeatNo").textContent = raw;
        renderChart(row, seatNum);
      });

      document.getElementById("printBtn").addEventListener("click", () => {
        const admNo = document.getElementById("admNo").value.trim();
        const seatNo = document.getElementById("seatInput").value.trim();
        if (admNo) document.getElementById("summaryAdmNo").textContent = admNo;
        if (seatNo)
          document.getElementById("summarySeatNo").textContent = seatNo;
        window.print();
      });
    </script>
  </body>
</html>
